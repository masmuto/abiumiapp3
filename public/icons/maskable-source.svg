<!-- Ikon maskable: simbol lebih kecil di tengah dengan safe zone -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background full bleed -->
  <rect width="512" height="512" fill="url(#bgM)"/>
  <!-- Wallet symbol scaled down untuk safe zone (radius 80% of 256 = ~205) -->
  <g transform="translate(160, 180) scale(0.6)">
    <rect x="0" y="40" width="272" height="160" rx="24" fill="#ffffff"/>
    <rect x="0" y="40" width="272" height="48" rx="24" fill="#f3f4f6"/>
    <rect x="180" y="100" width="80" height="60" rx="8" fill="#10b981"/>
    <circle cx="220" cy="130" r="10" fill="#ffffff"/>
    <path d="M 40 40 L 40 20 Q 40 0 60 0 L 220 0 Q 240 0 240 20 L 240 40 Z" fill="#fbbf24"/>
  </g>
  <text x="256" y="450" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="60"
        font-weight="bold"
        fill="#fbbf24">Rp</text>
</svg>
